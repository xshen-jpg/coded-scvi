[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "coded-scvi"
version = "0.1.0"
description = "Binary, repetition-coded latents for scVI and MrVI (scvi-tools)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "scvi-tools>=1.4,<1.5",   # MrVI variants build on scvi.external.mrvi_torch (tested with 1.4.2)
    "torch",
    "anndata",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/codedvi", "src/codedmrvi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
